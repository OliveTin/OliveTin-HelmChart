{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "olivetin.fullname" . }}
  labels:
    {{- include "olivetin.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- /* OliveTin 3k EventStream websocket; nginx ingress idle timeout defaults to 60s. */}}
  {{- if not (hasKey $annotations "nginx.ingress.kubernetes.io/proxy-read-timeout") }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-read-timeout" "600" }}
  {{- end }}
  {{- if not (hasKey $annotations "nginx.ingress.kubernetes.io/proxy-send-timeout") }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/proxy-send-timeout" "600" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "olivetin.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
